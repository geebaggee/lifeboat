name: Lifeboat
description: Copy a Postgres database, and optional S3-compatible storage, to the region you choose or any S3-compatible API. Once a month, restore the newest dump into throwaway Postgres.
branding:
  icon: life-buoy
  color: blue

inputs:
  mode:
    description: backup or restore-test
    required: false
    default: backup
  database-url:
    description: Session pooler Postgres URL on port 5432. The username must be role.project-ref, for example lastgood_backup.<project-ref>. Not the direct db.*.supabase.co host, and not the transaction pooler. LastGood can write this secret. A manual URL is the fallback.
    required: false
    default: ""
  restore-database-url:
    description: Throwaway Postgres URL used by restore-test.
    required: false
    default: ""
  s3-endpoint:
    description: S3-compatible API endpoint. Empty uses the Sydney region.
    required: false
    default: https://s3.ap-southeast-2.wasabisys.com
  s3-region:
    description: Region sent to the destination API.
    required: false
    default: ap-southeast-2
  s3-bucket:
    description: Destination bucket.
    required: true
  s3-access-key-id:
    description: Destination access key.
    required: true
  s3-secret-access-key:
    description: Destination secret key.
    required: true
  s3-prefix:
    description: Key prefix inside the bucket.
    required: false
    default: lifeboat
  encrypt:
    description: Encrypt the dump on the runner before upload. true or false.
    required: false
    default: "true"
  encryption-passphrase:
    description: Passphrase the customer types and keeps. LastGood writes it once and does not keep a copy.
    required: false
    default: ""
  manage-retention:
    description: When true, delete destination objects older than retention-days. Hosted storage sets this to false because the bucket lifecycle and object lock own retention.
    required: false
    default: "true"
  retention-days:
    description: Delete destination objects older than this many days when manage-retention is true.
    required: false
    default: "30"
  storage-s3-endpoint:
    description: Optional source S3 endpoint, such as Supabase Storage's S3 API.
    required: false
    default: ""
  storage-s3-region:
    description: Region for the source storage API.
    required: false
    default: us-east-1
  storage-s3-access-key-id:
    description: Optional source access key.
    required: false
    default: ""
  storage-s3-secret-access-key:
    description: Optional source secret key.
    required: false
    default: ""
  project:
    description: Stable name sent with the check-in, such as the Supabase project ref.
    required: false
    default: ""
  checkin-url:
    description: Where a signed status is posted.
    required: false
    default: https://lastgood.app/api/checkin
  checkin-secret:
    description: HMAC secret. Leave empty to skip the check-in.
    required: false
    default: ""
  postgres-major:
    description: Major version of the customer's Postgres. The client installed here matches the throwaway restore image.
    required: false
    default: "17"

runs:
  using: composite
  steps:
    - name: Install the Postgres client
      shell: bash
      env:
        POSTGRES_MAJOR: ${{ inputs.postgres-major }}
      run: |
        major="${POSTGRES_MAJOR:-17}"
        case "$major" in
          12|13|14|15|16|17) ;;
          *) echo "Postgres major must be 12, 13, 14, 15, 16 or 17." >&2; exit 1 ;;
        esac
        # The runner image already has an older pg_dump on PATH. The matching client lives here.
        bin="/usr/lib/postgresql/${major}/bin"
        ready() {
          [[ -x "${bin}/pg_dump" && -x "${bin}/pg_restore" && -x "${bin}/psql" ]] || return 1
          "${bin}/pg_dump" --version | grep -Eq " ${major}\.[0-9]"
        }
        if ! ready; then
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # shellcheck disable=SC1091
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${major}"
        fi
        if ! ready; then
          echo "postgresql-client-${major} is not available at ${bin}. The runner's default pg_dump is a different major and cannot dump a newer server." >&2
          exit 1
        fi
        echo "$bin" >> "$GITHUB_PATH"
    - name: Run Lifeboat
      shell: bash
      env:
        POSTGRES_MAJOR: ${{ inputs.postgres-major }}
        LIFEBOAT_MODE: ${{ inputs.mode }}
        DATABASE_URL: ${{ inputs.database-url }}
        RESTORE_DATABASE_URL: ${{ inputs.restore-database-url }}
        S3_ENDPOINT: ${{ inputs.s3-endpoint }}
        S3_REGION: ${{ inputs.s3-region }}
        S3_BUCKET: ${{ inputs.s3-bucket }}
        S3_ACCESS_KEY_ID: ${{ inputs.s3-access-key-id }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.s3-secret-access-key }}
        S3_PREFIX: ${{ inputs.s3-prefix }}
        LIFEBOAT_ENCRYPT: ${{ inputs.encrypt }}
        LIFEBOAT_ENCRYPTION_PASSPHRASE: ${{ inputs.encryption-passphrase }}
        LIFEBOAT_MANAGE_RETENTION: ${{ inputs.manage-retention }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        STORAGE_S3_ENDPOINT: ${{ inputs.storage-s3-endpoint }}
        STORAGE_S3_REGION: ${{ inputs.storage-s3-region }}
        STORAGE_S3_ACCESS_KEY_ID: ${{ inputs.storage-s3-access-key-id }}
        STORAGE_S3_SECRET_ACCESS_KEY: ${{ inputs.storage-s3-secret-access-key }}
        LIFEBOAT_PROJECT: ${{ inputs.project }}
        CHECKIN_URL: ${{ inputs.checkin-url }}
        CHECKIN_SECRET: ${{ inputs.checkin-secret }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
